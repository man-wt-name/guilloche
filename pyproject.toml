[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ornament_gen"
version = "2.0.0"
description = "High-quality guilloche-style ornament generator for document-grade patterns"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ornament_gen contributors" }]
keywords = [
    "guilloche",
    "ornament",
    "banknote",
    "pattern",
    "generator",
    "document",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.1.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ornament_gen = "ornament_gen.cli:main"

[tool.setuptools.packages.find]
include = ["ornament_gen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"